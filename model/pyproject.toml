[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cph-dispatch"
version = "0.1.0"
description = "Representative Copenhagen heat dispatch and HTF/PTES optimisation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.11,<1"]
gurobi = ["gurobipy>=12,<14"]

[project.scripts]
cph-dispatch = "cph_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

